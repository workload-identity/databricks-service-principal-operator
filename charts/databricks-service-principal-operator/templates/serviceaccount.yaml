{{/*
The identity the operator presents to Databricks, and the one it presents to the
API server. Its name is half of the subject the operator's federation policy
names -- system:serviceaccount:<namespace>:<name> -- so renaming it after step 1
of the install breaks token exchange with an error that reads as though the
policy were wrong.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dbxsp.serviceAccountName" . }}
  namespace: {{ include "dbxsp.namespace" . }}
  labels:
    {{- include "dbxsp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
