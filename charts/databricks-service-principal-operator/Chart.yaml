apiVersion: v2
name: databricks-service-principal-operator
description: Gives a Kubernetes workload a Databricks identity with no credential anywhere
type: application
# One version, released together: the chart names the operator it installs and
# the two move as a pair, so `helm install --version 0.15.0` and the v0.15.0
# release are the same thing and nobody has to hold a table of which chart goes
# with which operator. They differ only in the `v`, which Helm does not allow in
# a chart version and this project uses everywhere else.
#
# TestTheChartAndTheOperatorShareAVersion holds them together.
version: 0.15.0
appVersion: "v0.15.0"
# 1.30, because the ValidatingWebhookConfiguration this chart installs carries
# matchConditions, and that is what stands in for the namespaceSelector it
# cannot have. On an older API server the field is dropped rather than refused,
# and the operator silently lands on the write path of every ServiceAccount in
# the cluster.
kubeVersion: ">=1.30.0-0"
home: https://github.com/workload-identity/databricks-service-principal-operator
sources:
- https://github.com/workload-identity/databricks-service-principal-operator
keywords:
- databricks
- workload-identity
- oidc
