---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: databricks-token
webhooks:
- name: podtoken.databricks.workload-identity.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-v1-pod
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  # Asked again when a later webhook changes the pod.
  #
  # The default is Never, and what it costs is a container added after this
  # ran -- a mesh sidecar, a policy engine -- that has no token, no mount and
  # no variables, in a pod that carries all of them at pod level and is
  # therefore reported as equipped. Its workload fails on its first call to
  # Databricks with an error naming Databricks.
  #
  # Safe to ask twice because being asked twice does nothing: a pod already
  # carrying this volume is left untouched, so the second pass adds the
  # containers that appeared and changes nothing that was already there.
  #
  # It does not cover a later webhook rewriting spec.serviceAccountName. The
  # pod then holds the client id and the token of the identity it had before
  # the change, and this webhook, seeing its own volume, leaves it alone. That
  # is a deliberate limit and not an oversight: rewriting a volume somebody
  # may have written themselves is the opposite of what this promises.
  reinvocationPolicy: IfNeeded
  # Ignore, deliberately, and the reasoning is worth keeping.
  #
  # This stands on the pod creation path for every pod matched below. With
  # Fail, an outage of this webhook stops workloads from starting -- including
  # ones that have nothing to do with Databricks, if the selector is ever
  # widened by mistake. That is a much larger failure than the one it prevents.
  #
  # What Ignore costs is a pod that starts without its token and fails on its
  # first call to Databricks. That failure is legible: the workload's
  # DatabricksServiceAccount says whether the identity is ready, and the pod
  # is missing a volume anybody can see is missing. Trading a legible failure
  # for cluster-wide unschedulability is the wrong way round.
  failurePolicy: Ignore
  # Only namespaces enabled for injection. The label is inject and not mint:
  # mint is whether new identities may be made in a namespace, and the two end
  # at different times -- taking mint off leaves the identities already minted
  # working, and the pods that come after it still have to be equipped. A
  # namespace nobody enabled is one this webhook is never consulted for --
  # which is also what keeps the blast radius of the line above small.
  namespaceSelector:
    matchLabels:
      databricks.workload-identity.io/inject: "enabled"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: databricks-request
webhooks:
- name: serviceaccountrequest.databricks.workload-identity.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-v1-serviceaccount
  # UPDATE as well as CREATE, because the annotation is far more often added to
  # a ServiceAccount that already exists than written with one.
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - serviceaccounts
  # Ignore, for the reason the pod webhook gives, and it weighs more here: this
  # stands on the write path of every ServiceAccount in the cluster. With Fail,
  # an outage of this operator would stop anybody from creating a ServiceAccount
  # anywhere, in namespaces that have never heard of Databricks. That is a far
  # larger failure than the one it prevents.
  #
  # What Ignore costs is nothing that was not already the case. The controller
  # is what enforces the account's namespace list; this only moves the refusal
  # to where a person is standing, so losing it puts the request back where it
  # was -- unanswered, with nothing saying why.
  failurePolicy: Ignore
  # No namespaceSelector, deliberately, and it is the opposite call from the one
  # above. The namespaces this has to be consulted for are exactly the ones
  # nobody enrolled: a request in an enrolled namespace is answered, and it is
  # the request in a namespace this account never named that goes unanswered. A
  # selector would exempt the only case this exists for.
  #
  # So the filtering is done by the API server instead, before this operator is
  # called at all. matchConditions is CEL evaluated in the API server, GA since
  # Kubernetes 1.30, and only a ServiceAccount carrying a key with this
  # operator's annotation prefix is sent here -- which is a handful of writes in
  # the cluster rather than all of them.
  #
  # It reads object and not oldObject, which is what makes taking the annotation
  # off never reach this webhook at all. A removal leaves an object with no such
  # key, the condition is false, and the API server admits it without asking. It
  # is the one write that must always go through, and this is the cheapest place
  # to guarantee it.
  matchConditions:
  - name: asks-for-a-service-principal
    expression: has(object.metadata.annotations) && object.metadata.annotations.exists(k, k.startsWith("databricks.workload-identity.io/service-principal"))
