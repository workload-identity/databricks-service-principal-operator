# This rule is not used by the project databricks-service-principal-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to databricks.workload-identity.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: databricks-service-principal-operator
    app.kubernetes.io/managed-by: kustomize
  name: databricksserviceprincipal-viewer-role
rules:
- apiGroups:
  - databricks.workload-identity.io
  resources:
  - databricksserviceprincipals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - databricks.workload-identity.io
  resources:
  - databricksserviceprincipals/status
  verbs:
  - get
