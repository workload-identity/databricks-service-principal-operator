# This rule is not used by the project databricks-service-principal-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over databricks.workload-identity.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: databricks-service-principal-operator
    app.kubernetes.io/managed-by: kustomize
  name: databricksaccount-admin-role
rules:
- apiGroups:
  - databricks.workload-identity.io
  resources:
  - databricksaccounts
  verbs:
  - '*'
- apiGroups:
  - databricks.workload-identity.io
  resources:
  - databricksaccounts/status
  verbs:
  - get
